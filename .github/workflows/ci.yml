name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t songying-pwa:test .
      - run: docker run -d --name songying-pwa -p 8080:80 songying-pwa:test
      - run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/healthz
      - run: curl --fail http://localhost:8080/stamp/lake?k=LAKE-26
      - run: docker rm -f songying-pwa
        if: always()
