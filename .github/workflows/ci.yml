name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: songying-ci
      STAFF_USERNAME: ci-staff
      STAFF_PASSWORD: ci-only-password-not-for-deployment
      STAMP_KEYS: '{"lake":"CI-LAKE-CODE-12345678","library":"CI-PHOTO-CODE-12345678","gate":"CI-GATE-CODE-12345678"}'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      - run: curl --fail http://localhost:8080/healthz
      - run: curl --fail http://localhost:8080/stamp/lake?k=CI-LAKE-CODE-12345678
      - run: docker compose down
        if: always()
